<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>美股交易策略紀錄</title>
    <meta name="description" content="個人美股交易日誌、策略追蹤與損益管理工具" />
    <meta property="og:title" content="美股交易策略紀錄" />
    <meta property="og:description" content="個人美股交易日誌、策略追蹤與損益管理工具" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />
    <script>
      // Automatically register retry service worker to absorb 429/503 rate limits
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(function() {});
      }

      // Automatically recover if a browser requests invalidated prebundled chunk hashes or hits a transient gateway error
      window.addEventListener('vite:preloadError', function(event) {
        console.warn('Vite preload error detected, auto-refreshing...', event);
        window.location.reload();
      });

      function handleTransientError(sourceStr) {
        var str = (sourceStr || '') + '';
        if (
          str.indexOf('chunk-') !== -1 ||
          str.indexOf('Failed to fetch') !== -1 ||
          str.indexOf('429') !== -1 ||
          str.indexOf('.tsx') !== -1 ||
          str.indexOf('.ts') !== -1 ||
          str.indexOf('dynamically imported module') !== -1 ||
          str.indexOf('importing a module script failed') !== -1
        ) {
          var key = 'vite_chunk_recover_' + Math.floor(Date.now() / 6000);
          if (!sessionStorage.getItem(key)) {
            sessionStorage.setItem(key, '1');
            console.warn('Recovering from transient load failure, refreshing in 250ms...', str);
            setTimeout(function() { window.location.reload(); }, 250);
          }
        }
      }

      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || '')) + '';
        var src = (event && (event.filename || '')) + '';
        var targetSrc = event && event.target && event.target.src ? (event.target.src + '') : '';
        handleTransientError(msg + ' ' + src + ' ' + targetSrc);
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || reason)) + '';
        handleTransientError(msg);
      });
    </script>
  </head>
  <body style="margin: 0; background-color: #f5f5f7; color: #18181b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background: #f5f5f7;">
        <div style="background: #ffffff; border: 1px solid #e4e4e7; border-radius: 20px; padding: 28px 36px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; max-width: 420px; width: 100%;">
          <div style="width: 36px; height: 36px; border: 3px solid #e4e4e7; border-top-color: #10b981; border-radius: 50%; animation: aistudio-spin 0.8s linear infinite;"></div>
          <div style="font-size: 16px; font-weight: 800; color: #18181b; letter-spacing: -0.01em;">美股交易策略與風險管理系統</div>
          <div style="font-size: 12px; font-weight: 600; color: #71717a;">正在載入系統工作區與即時報價...</div>
        </div>
      </div>
      <style>@keyframes aistudio-spin { to { transform: rotate(360deg); } }</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
